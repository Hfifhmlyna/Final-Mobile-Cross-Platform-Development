name: edutech_smk
description: Sistem Manajemen Pembelajaran untuk SMK dengan multi-role authentication
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Authentication
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.8
  firebase_messaging: ^15.1.5

  # State Management
  provider: ^6.1.2

  # UI Components & Loading
  flutter_spinkit: ^5.2.1
  
  # Utilities
  intl: ^0.19.0
  
  # QR Code & Barcode Scanner
  mobile_scanner: ^5.2.3
  
  # PDF Generation & Viewing
  pdf: ^3.11.1
  
  # Additional helpful packages
  shared_preferences: ^2.3.3
  http: ^1.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.14.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

